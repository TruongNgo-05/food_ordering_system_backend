server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/food_ordering_system
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL}  # Gmail gửi đi
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000
  #          gioi han anh
  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 30MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope:
              - email
              - public_profile
jwt:
  secret: examSecretKeyexamSecretKeyexamSecretKey123456789
  access-expiration: 1800000
  refresh-expiration: 604800000


sepay:
  bank-account: 18995736789
  bank-name: TPBank

app:
  backend-url: http://localhost:8080
# backend-url: https://subfractionally-wrinkleable-kenneth.ngrok-free.dev de hien qr public
  frontend-url: http://localhost:5173